name: LinlangRuntimeBukkit
main: me.jling.plugin.BukkitLoader
version: ${project.version}
api-version: '1.18'
load: STARTUP
authors: [JLING]
website: https://jling.me
description: Linlang runtime for Bukkit/Paper. Provides Linlang services to other plugins.

commands:
  linlang:
    description: linlang runtime plugin internal commands
    usage: /<command> [args]
    aliases: linlang

permissions:
  linlangruntimebukkit.admin:
    description: Allows to use linlang runtime admin commands
    default: op
  linlang.text.chat:
    description: Allows advanced text in player chat
    default: op
  linlang.text.command:
    description: Allows advanced text in supported text command arguments
    default: op
  linlang.text.book:
    description: Allows advanced text in edited book pages
    default: op
  linlang.text.anvil:
    description: Allows advanced text in anvil item names
    default: op
  linlang.text.sign:
    description: Allows advanced text on signs
    default: op
  linlang.text.join:
    description: Allows advanced text in the player's join message
    default: op
  linlang.text.quit:
    description: Allows advanced text in the player's quit message
    default: op
  linlang.text.death:
    description: Allows advanced text in the player's death message
    default: op
  linlang.text.advancement:
    description: Allows advanced text in the player's advancement announcement
    default: op
  linlang.text.kick:
    description: Allows advanced text in the player's kick messages
    default: op
  linlang.text.broadcast:
    description: Allows rendering trusted server broadcasts
    default: op
  linlang.text.motd:
    description: Allows rendering trusted server list MOTD text
    default: op
  linlang.text.item:
    description: Allows rendering item names and lore
    default: op
  linlang.text.entity:
    description: Allows rendering entity custom names
    default: op
  linlang.text.text-display:
    description: Allows rendering TextDisplay text on supported server versions
    default: op
