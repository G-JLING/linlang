# 唯一标识
id: "demo.shop"
# 界面类型
type: "inventory"
# 界面行数（若可用）
rows: 6
# 界面标题
title: "§fShop - {state.category}"
# 允许玩家手动关闭否
allowManualClose: false

# 空间布局
layout:
  - "#########"
  - "#..S..N.#"
  - "#..LLLL.#"
  - "#..LLLL.#"
  - "#..LLLL.#"
  - "#B..P..R#"

# 界面元素
legend:
  "#":
    # 元素类型：静态
    kind: "static"
    # 元素唯一标识
    uid: "border"
    # 元素图标元数据
    icon:
      kind: "vanilla"
      key: "BLACK_STAINED_GLASS_PANE"
      name: " "
      lore: [ ]

  "S":
    # 元素类型：静态
    kind: "static"
    # 元素唯一标识
    uid: "search"
    # 元素图标元数据
    icon:
      kind: "itemsadder"
      key: "my_pack:icon_search"
      name: "§aSearch"
      lore: [ "§7Click to search" ]
    # 动作路由（点击以触发）
    action:
      # 动作类型：引发
      type: "hook"
      # 动作参数
      args: {
        hookId: "shop.search"
      }
      # 刷新区域
      refresh: "view"

  "N":
    kind: "static"
    uid: "next"
    icon:
      kind: "vanilla"
      key: "ARROW"
      name: "§aNext"
      lore: [ ]
    action:
      type: "hook"
      args: { hookId: "shop.nextPage" }
      refresh: "area:items"

  "P":
    kind: "static"
    uid: "prev"
    icon:
      kind: "vanilla"
      key: "ARROW"
      name: "§cPrev"
      lore: [ ]
    action:
      type: "hook"
      args: { hookId: "shop.prevPage" }
      refresh: "area:items"

  "B":
    kind: "static"
    uid: "balance"
    icon:
      kind: "vanilla"
      key: "SUNFLOWER"
      name: "§fBalance: §e{state.balance}"
      lore: [ ]

  "R":
    kind: "static"
    uid: "back"
    icon:
      kind: "vanilla"
      key: "BARRIER"
      name: "§cBack"
      lore: [ ]
    action:
      type: "back"
      args: { }
      refresh: "view"

# 动态区域
dynamicAreas:
  # 单个动态区域的唯一标识
  - id: "items"
    # 区域在界面空间中的代表字符
    areaChar: "L"
    # 当数据数量溢出区域大小时的处理方式
    overflow: "pagination"
    # 当数据不足以填满区域时，区域填充的图标
    emptyFill:
      icon:
        kind: "vanilla"
        key: "GRAY_STAINED_GLASS_PANE"
        name: " "
        lore: [ ]
    # 数据源定义
    source:
      # 注册在插件代码中的数据源的唯一标识符
      id: "shop.items"
      # 接受的参数
      args:
        category: "{state.category}"
        page: "{state.page}"
        pageSize: "{state.pageSize}"
    # 动态数据模板：用于把每一条 row 渲染成一个按钮。
    # row.* 变量来自数据源（shop.items）返回的行数据（GuiRow.data）
    template:
      # 变体（variants）：按条件选择不同的样式/行为。
      # - 从上到下依次匹配，命中第一个 when 为 true 的变体。
      # - when 为逻辑表达式，支持以下运算符
      #     == != < <= > >=  && || !  ( )
      # - 变量引用使用占位符：{row.xxx} / {state.xxx}
      # - 约定：最后给一个 when: "true" 的默认变体作为兜底。
      variants:
        # 变体 1：售罄（库存 <= 0）
        - id: "soldOut"
          when: "{row.stock} <= 0"
          enabled: false
          icon:
            kind: "vanilla"
            key: "BARRIER"
            name: "§cSold Out"
            lore:
              - "§7{row.name}"
              - ""
              - "§cOut of stock"

        # 变体 2：买不起（由数据源提供 row.affordable=false）
        - id: "cannotAfford"
          when: "{row.affordable} == false"
          enabled: true
          icon:
            kind: "itemsadder"
            key: "{row.ia_id}"
            name: "§7{row.name}"
            lore:
              - "§7Price: §e{row.price}"
              - "§cNot enough money"
              - ""
              - "§7Click to view"
          action:
            type: "hook"
            args:
              hookId: "shop.preview"
              itemId: "{row.id}"
            refresh: ""

        # 变体 3：默认展示（兜底）
        - id: "default"
          when: "true"
          enabled: true
          icon:
            kind: "itemsadder"
            key: "{row.ia_id}"
            name: "§f{row.name}"
            lore:
              - "§7Price: §e{row.price}"
              - "§7Stock: §a{row.stock}"
              - ""
              - "§aClick to buy"
          action:
            type: "hook"
            args:
              hookId: "shop.buy"
              itemId: "{row.id}"
            refresh: "area:items"