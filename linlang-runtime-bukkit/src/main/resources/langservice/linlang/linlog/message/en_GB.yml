lin-runtime:
  loading: "Linlang is loading"
  enabled: "Linlang runtime enabled in {elapsed}ms. API={api}, Runtime={runtime}, Plugin={plugin}"
  disabling: "Linlang runtime is shutting down"
  closed: "Linlang runtime closed"

lin-file:
  file:
    file-missing-keys: "{file} has {count} missing keys. See {diff} for details."
    file-generated-different: "Generated difference file: {diff}"
    file-saved: "Saved configuration: {file}"
    file-reloaded: "Configuration files reloaded successfully"

  lang:
    lang-missing-keys: "{file} has {count} missing keys. See {diff} for details."
    lang-generated-different: "Generated language difference file: {diff}"
    lang-saved: "Saved language file: {file}"
    lang-reloaded: "Language files reloaded successfully"

  watcher:
    enabled: "Dynamic file reload enabled"
    event-skipped: "Ignored an event caused by a file service write: {file}"
    event-accepted: "Accepted file change event: {file}"
    config-reloaded: "Dynamically reloaded configuration: {file}"
    addon-reloaded: "Dynamically reloaded addon file: {file}"
    language-reloaded: "Dynamically reloaded language file: {file}"

lin-data:
  connection-pool-closed: "Database connection pool closed: {type}"
  db-init: "Initialized database: {type} {url}"

lin-banner:
  font-search: "Bukkit is searching for font resources"
