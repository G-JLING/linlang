lin-runtime:
  loading: "Linlang 正在加载"
  enabled: "Linlang 运行时已启用，耗时 {elapsed}ms。API={api}, Runtime={runtime}, Plugin={plugin}"
  disabling: "Linlang 运行时正在关闭"
  closed: "Linlang 运行时已关闭"

lin-file:
  file:
    file-missing-keys: "{file} 缺失键 {count} 个。详情见 {diff}"
    file-generated-different: "已生成差异告知文件：{diff}"
    file-saved: "已保存配置：{file}"
    file-reloaded: "配置文件重新加载成功"

  lang:
    lang-missing-keys: "{file} 缺失键 {count} 个。详情见 {diff}"
    lang-generated-different: "已生成差异告知文件：{diff}"
    lang-saved: "已保存语言：{file}"
    lang-reloaded: "语言文件重新加载成功"

  watcher:
    enabled: "文件动态重载已启用"
    event-skipped: "已忽略文件服务自身写入产生的事件：{file}"
    event-accepted: "已接受文件变更事件：{file}"
    config-reloaded: "已动态重载配置文件：{file}"
    addon-reloaded: "已动态重载附加文件：{file}"
    language-reloaded: "已动态重载语言文件：{file}"

lin-data:
  connection-pool-closed: "数据库连接池已关闭：{type}"
  db-init: "已初始化数据库：{type} {url}"

lin-banner:
  font-search: "Bukkit 正在查找字体文件资源"
