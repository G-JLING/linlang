descriptions:
  LIN-AUDIT-FILE-WRITE-FAIL: "日志、审计或问题文件写入失败。"
  LIN-AUDIT-JSON-SERIALIZE-FAIL: "结构化记录无法序列化为 JSON。"
  LIN-AUDIT-OUTPUT-PATH-INVALID: "日志输出路径无效或离开了插件数据目录。"
  LIN-AUDIT-RUNTIME-CONFIG-LOAD-FAIL: "运行时审计配置无法加载，已使用默认配置。"
  LIN-AUDIT-TENANT-CONFIG-LOAD-FAIL: "插件审计租户配置无法加载，插件将暂时使用运行时配置。"
  LIN-AUDIT-WRITER-FLUSH-FAIL: "文件写入队列未能在规定时间内完成刷新。"
  LIN-AUDIT-WRITER-QUEUE-FULL: "异步文件写入队列已满，当前记录已经降级为同步写入。"
  LIN-BANNER-FONT-LOAD-FAIL: "ASCII Banner 字体资源存在但无法解析。"
  LIN-COMMAND-ARGUMENT-PARSE-FAIL: "命令参数解析器发生非预期异常。"
  LIN-COMMAND-BUKKIT-BIND-FAIL: "命令根节点无法绑定到 Bukkit PluginCommand。"
  LIN-COMMAND-EXECUTE-FAIL: "已匹配命令的执行器抛出异常。"
  LIN-COMMAND-GROUP-CALLBACK-FAIL: "命令组的公共结果回调执行失败。"
  LIN-COMMAND-INFO-FAIL: "命令框架无法读取插件信息。"
  LIN-COMMAND-LOCALE-REFRESH-FAIL: "命令用法和参数说明无法刷新到新语言。"
  LIN-COMMAND-MESSAGE-LOAD-FAIL: "命令框架的内建消息无法从语言服务加载。"
  LIN-COMMAND-REGISTRATION-FAIL: "命令描述语句或注册结构无效，命令未完成注册。"
  LIN-DATA-FLUSH-FAIL: "仓库中的待处理数据无法刷新。"
  LIN-DATA-INITIALIZE-FAIL: "数据库目录或连接池无法初始化。"
  LIN-DATA-MAPPING-INVALID: "数据库实体声明无法映射为有效的数据表结构。"
  LIN-DATA-MIGRATE-FAIL: "实体表结构创建或迁移失败。"
  LIN-DATA-OPERATION-FAIL: "数据库仓库操作执行失败。"
  LIN-DATA-RESOURCE-CLOSE-FAIL: "数据库仓库或连接池无法正常关闭。"
  LIN-EVENT-LISTENER-FAIL: "事件监听器执行失败。"
  LIN-FILE-CONFIG-BIND-FAIL: "配置类无法完成首次绑定。"
  LIN-FILE-CONFIG-LOAD-FAIL: "配置加载或类型校验失败，失败文件保留原有活动值。"
  LIN-FILE-CONFIG-RELOAD-FAIL: "配置文件无法重载到现有对象。"
  LIN-FILE-CONFIG-SAVE-FAIL: "配置对象无法写入文件。"
  LIN-FILE-DIFF-WRITE-FAIL: "缺失字段差异文件无法生成。"
  LIN-FILE-LANGUAGE-BIND-FAIL: "语言类无法完成首次绑定。"
  LIN-FILE-LANGUAGE-ENSURE-FAIL: "语言文件完整性检查或默认值补齐失败。"
  LIN-FILE-LANGUAGE-FORMAT-FAIL: "语言文本无法使用给定参数完成格式化。"
  LIN-FILE-LANGUAGE-LAZY-LOAD-FAIL: "引用型语言字段无法按需加载目标语言。"
  LIN-FILE-LANGUAGE-LISTENER-FAIL: "语言变更监听器执行失败。"
  LIN-FILE-LANGUAGE-LOCALE-NORMALIZE-FAIL: "语言文件名无法规范为标准语言代码。"
  LIN-FILE-LANGUAGE-LOCALE-SCAN-FAIL: "语言目录无法扫描可用语言文件。"
  LIN-FILE-LANGUAGE-LOCALE-SWITCH-FAIL: "语言对象无法切换到目标语言。"
  LIN-FILE-LANGUAGE-REFERENCE-FAIL: "配置语言引用不存在或文本类型不匹配，相关键使用默认值。"
  LIN-FILE-LANGUAGE-RELOAD-FAIL: "语言文件无法重载到现有语言对象。"
  LIN-FILE-LANGUAGE-RESOURCE-COPY-FAIL: "内建语言资源无法复制到插件数据目录。"
  LIN-FILE-LANGUAGE-RESOURCE-LOAD-FAIL: "内建语言资源存在但无法读取或解析。"
  LIN-FILE-LANGUAGE-SAVE-FAIL: "语言对象无法写入语言文件。"
  LIN-FILE-OBJECT-MAPPING-FAIL: "文件文档与 Java 对象之间的字段映射失败。"
  LIN-FILE-WATCH-CALLBACK-FAIL: "文件热重载回调执行失败。"
  LIN-FILE-WATCH-LOOP-FAIL: "文件监听循环发生非预期故障。"
  LIN-FILE-WATCH-START-FAIL: "文件热重载监听无法启动。"
  LIN-MESSAGE-DELIVERY-FAIL: "已选中的消息传输器无法完成投递。"
  LIN-MESSAGE-PREFIX-RESOLVE-FAIL: "消息前缀提供函数执行失败。"
  LIN-PLATFORM-ASYNC-DISPATCH-FAIL: "任务无法提交到 Bukkit 异步调度器，已尝试当前线程降级执行。"
  LIN-PLATFORM-MAIN-DISPATCH-FAIL: "任务无法提交到 Bukkit 主线程，已尝试当前线程降级执行。"
  LIN-RUNTIME-CONFIG-RELOAD-FAIL: "运行时配置服务重载失败。"
  LIN-RUNTIME-ENABLE-FAIL: "Linlang 运行时启动失败。"
  LIN-RUNTIME-FACADE-CLOSE-FAIL: "插件门面关闭失败。"
  LIN-RUNTIME-FACADE-RELOAD-FAIL: "插件门面软重载失败。"
  LIN-RUNTIME-FACADE-RESTART-FAIL: "插件门面硬重启失败。"
  LIN-RUNTIME-LANGUAGE-RELOAD-FAIL: "运行时语言服务重载失败。"
  LIN-RUNTIME-MESSAGE-TEMPLATE-INSTALL-FAIL: "运行时内建消息模板无法安装。"
  LIN-RUNTIME-RELOAD-FAIL: "重载时遇到了问题，一些文件未能重载。"
  LIN-RUNTIME-RESOURCE-CLOSE-FAIL: "运行时资源释放失败。"
  LIN-RUNTIME-VERSION-INCOMPATIBLE: "依赖版本与运行时的 A.B 版本号不同，或运行时缺少插件要求的 API 功能版本，已终止初始化。"
  LIN-RUNTIME-VERSION-INVALID: "无法识别依赖或运行时的四段版本号，已终止初始化。"
  LIN-RUNTIME-VERSION-MISMATCH: "运行时的 API 功能版本高于插件编译版本，请注意检查兼容性。"
  LIN-TEXT-SOURCE-TOO-LONG: "高级字符串源码超过运行时长度限制。"
  LIN-VIEW-DEFINITION-LOAD-FAIL: "GUI 定义文件无法读取、解析或编译。"
  LIN-VIEW-HOOK-EXECUTE-FAIL: "GUI 交互回调执行失败。"
  LIN-VIEW-ICON-RESOLVE-FAIL: "GUI 图标无法由平台资源解析器建立。"
  LIN-VIEW-INITIALIZE-FAIL: "界面服务或平台事件桥初始化失败。"
  LIN-VIEW-LANGUAGE-REFRESH-FAIL: "语言变更后界面重绘失败。"
  LIN-VIEW-REOPEN-FAIL: "禁止手动关闭的 GUI 无法重新打开。"
  LIN-VIEW-SOURCE-LOAD-FAIL: "GUI 动态数据源执行失败。"
  LIN-YAML-INIT-FAIL: "SnakeYAML 无法加载或初始化。"

resolutions:
  LIN-AUDIT-FILE-WRITE-FAIL: "请检查磁盘空间、目录权限、文件占用和路径有效性。"
  LIN-AUDIT-JSON-SERIALIZE-FAIL: "请检查上下文字段是否包含不可安全转换的对象。"
  LIN-AUDIT-OUTPUT-PATH-INVALID: "使用插件数据目录内的相对路径，不要填写绝对路径或包含 .. 的路径。"
  LIN-AUDIT-RUNTIME-CONFIG-LOAD-FAIL: "请检查 audit.yml 的结构、字段类型和文件权限。"
  LIN-AUDIT-TENANT-CONFIG-LOAD-FAIL: "请检查插件数据目录中的 audit.yml，并确认插件 owner 已正确注册。"
  LIN-AUDIT-WRITER-FLUSH-FAIL: "请检查磁盘状态，并确认插件关闭流程没有阻塞写入线程。"
  LIN-AUDIT-WRITER-QUEUE-FULL: "请检查磁盘写入速度，并根据负载调整 queue-capacity。"
  LIN-BANNER-FONT-LOAD-FAIL: "请检查字体 YAML 的 height、gap 与 glyphs 结构。"
  LIN-COMMAND-ARGUMENT-PARSE-FAIL: "请检查参数规范、解析器实现和收到的参数类型。"
  LIN-COMMAND-BUKKIT-BIND-FAIL: "确认命令根节点已在 plugin.yml 中声明，并由正确的插件注册。"
  LIN-COMMAND-EXECUTE-FAIL: "请根据 command 与 sender 上下文检查命令业务代码。"
  LIN-COMMAND-GROUP-CALLBACK-FAIL: "请根据 command、stage 与 handler 上下文检查命令组回调代码。"
  LIN-COMMAND-INFO-FAIL: "请检查平台插件描述对象和运行时版本元数据。"
  LIN-COMMAND-LOCALE-REFRESH-FAIL: "请检查延迟语言字段提供者以及命令描述、参数标签的实现。"
  LIN-COMMAND-MESSAGE-LOAD-FAIL: "请检查命令语言资源；运行时会使用不依赖文件的默认消息继续启动。"
  LIN-COMMAND-REGISTRATION-FAIL: "请根据 spec 上下文检查根命名空间、参数顺序、类型选项和重复签名。"
  LIN-DATA-FLUSH-FAIL: "请检查数据库连接、事务状态和仓库实现。"
  LIN-DATA-INITIALIZE-FAIL: "请检查 JDBC 配置、驱动、数据库目录权限和数据库可用性。"
  LIN-DATA-MAPPING-INVALID: "请检查实体注解、主键、字段类型、索引、列名和无参构造方法。"
  LIN-DATA-MIGRATE-FAIL: "请检查数据库权限、实体注解、列定义和现有表结构。"
  LIN-DATA-OPERATION-FAIL: "请根据 operation、entity 与 table 上下文检查 SQL、连接和实体字段映射。"
  LIN-DATA-RESOURCE-CLOSE-FAIL: "请检查仍在执行的数据库任务和资源关闭实现。"
  LIN-EVENT-LISTENER-FAIL: "请根据 event 与 owner 上下文定位监听器业务代码。"
  LIN-FILE-CONFIG-BIND-FAIL: "请检查配置注解、构造方法、迁移器、文件格式和字段类型。"
  LIN-FILE-CONFIG-LOAD-FAIL: "查看文件内的 Linlang 诊断注释或同名 .errors.txt 文件，修正后重新加载。"
  LIN-FILE-CONFIG-RELOAD-FAIL: "请检查配置格式、迁移器和字段类型是否与代码契约一致。"
  LIN-FILE-CONFIG-SAVE-FAIL: "请检查目标路径、文件权限、配置字段和值的可序列化性。"
  LIN-FILE-DIFF-WRITE-FAIL: "请检查目标目录权限和配置或语言文档是否能够序列化。"
  LIN-FILE-LANGUAGE-BIND-FAIL: "请检查 LangPack 注解、无参构造方法、资源文件和语言字段类型。"
  LIN-FILE-LANGUAGE-ENSURE-FAIL: "请检查语言包注解、语言代码、资源文件和目标目录权限。"
  LIN-FILE-LANGUAGE-FORMAT-FAIL: "请根据 key 与 template 上下文检查占位符语法和传入参数。"
  LIN-FILE-LANGUAGE-LAZY-LOAD-FAIL: "请检查目标语言文件格式、路径和 LangText、LangList 或 LangMap 对应值的类型。"
  LIN-FILE-LANGUAGE-LISTENER-FAIL: "请根据异常检查消费语言变更的服务。"
  LIN-FILE-LANGUAGE-LOCALE-NORMALIZE-FAIL: "请检查文件占用、目录权限和规范化后是否发生名称冲突。"
  LIN-FILE-LANGUAGE-LOCALE-SCAN-FAIL: "请检查语言目录权限、路径有效性和文件系统状态。"
  LIN-FILE-LANGUAGE-LOCALE-SWITCH-FAIL: "请检查目标语言文件和已绑定语言字段的类型。"
  LIN-FILE-LANGUAGE-REFERENCE-FAIL: "请检查语言包别名、包内路径以及字符串或字符串列表类型。"
  LIN-FILE-LANGUAGE-RELOAD-FAIL: "请检查语言文件格式以及 LangText、LangList 和 LangMap 字段结构。"
  LIN-FILE-LANGUAGE-RESOURCE-COPY-FAIL: "请检查目标目录权限、磁盘空间和内建资源是否可读取。"
  LIN-FILE-LANGUAGE-RESOURCE-LOAD-FAIL: "请检查 langservice 资源内容、字符编码和打包结果。"
  LIN-FILE-LANGUAGE-SAVE-FAIL: "请检查语言文件路径、权限和字段值的可序列化性。"
  LIN-FILE-OBJECT-MAPPING-FAIL: "请检查字段可访问性、嵌套对象无参构造方法和集合字段类型。"
  LIN-FILE-WATCH-CALLBACK-FAIL: "请检查对应文件的重载逻辑，并查看 path 上下文。"
  LIN-FILE-WATCH-LOOP-FAIL: "请检查 WatchService 状态、监听目录和回调线程是否仍然有效。"
  LIN-FILE-WATCH-START-FAIL: "请检查监听目录是否可创建，以及系统文件监听器是否可用。"
  LIN-MESSAGE-DELIVERY-FAIL: "请根据 transport 与 recipient 上下文检查平台连接和传输器实现。"
  LIN-MESSAGE-PREFIX-RESOLVE-FAIL: "请检查自定义前缀提供函数，并避免在其中访问尚未初始化的服务。"
  LIN-PLATFORM-ASYNC-DISPATCH-FAIL: "请检查插件是否已禁用，以及 Bukkit 调度器是否仍可接受任务。"
  LIN-PLATFORM-MAIN-DISPATCH-FAIL: "请检查插件是否已禁用，以及 Bukkit 调度器是否仍可接受任务。"
  LIN-RUNTIME-CONFIG-RELOAD-FAIL: "请检查配置文件格式、字段类型和文件权限。"
  LIN-RUNTIME-ENABLE-FAIL: "请检查同一异常的 cause，并确认 API 版本、服务注册和运行环境兼容。"
  LIN-RUNTIME-FACADE-CLOSE-FAIL: "请检查门面持有服务的关闭实现，并确认没有阻塞任务。"
  LIN-RUNTIME-FACADE-RELOAD-FAIL: "请根据 owner 定位插件，并检查前缀、语言与服务刷新回调。"
  LIN-RUNTIME-FACADE-RESTART-FAIL: "请根据 owner 定位插件，并检查文件、命令、消息和界面服务的重建过程。"
  LIN-RUNTIME-LANGUAGE-RELOAD-FAIL: "请检查语言文件格式、语言代码和文件权限。"
  LIN-RUNTIME-MESSAGE-TEMPLATE-INSTALL-FAIL: "请检查运行时语言资源与语言服务是否已经完成初始化。"
  LIN-RUNTIME-RELOAD-FAIL: "请查看失败文件和步骤，修正后重新执行软重载。"
  LIN-RUNTIME-RESOURCE-CLOSE-FAIL: "请根据 resource 与 owner 上下文定位未能关闭的服务。"
  LIN-RUNTIME-VERSION-INCOMPATIBLE: "安装满足插件要求的 Runtime；版本过低时获取新的匹配构建：https://jling.me/linlang"
  LIN-RUNTIME-VERSION-INVALID: "请检查版本元数据是否为 A.B.C.D 格式，并重新获取完整构建：https://jling.me/linlang"
  LIN-RUNTIME-VERSION-MISMATCH: "建议使用相同的 A.B.C；插件可以更新 API 依赖并重新测试：https://jling.me/linlang"
  LIN-TEXT-SOURCE-TOO-LONG: "缩短文本或拆分消息，不要把大型外部内容直接作为高级字符串解析。"
  LIN-VIEW-DEFINITION-LOAD-FAIL: "请根据 view 上下文检查 gui 目录中的 YAML 或 JSON 文件与布局定义。"
  LIN-VIEW-HOOK-EXECUTE-FAIL: "请根据 view、hook 与 slot 上下文检查回调业务代码。"
  LIN-VIEW-ICON-RESOLVE-FAIL: "请根据 resolver 与 icon 上下文检查材质名称或可选资源插件接口。"
  LIN-VIEW-INITIALIZE-FAIL: "请检查 GUI 事件监听注册、平台上下文和视图目录。"
  LIN-VIEW-LANGUAGE-REFRESH-FAIL: "请根据 view 上下文检查语言引用和平台界面状态。"
  LIN-VIEW-REOPEN-FAIL: "请检查玩家在线状态、插件生命周期和 Bukkit 调度器状态。"
  LIN-VIEW-SOURCE-LOAD-FAIL: "请根据 view、area 与 source 上下文检查数据源实现。"
  LIN-YAML-INIT-FAIL: "请检查 SnakeYAML 依赖是否存在，并确认版本与当前 Runtime 兼容。"
