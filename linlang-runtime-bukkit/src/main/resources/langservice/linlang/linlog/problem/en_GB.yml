descriptions:
  LIN-AUDIT-FILE-WRITE-FAIL: "A log, audit, or problem file could not be written."
  LIN-AUDIT-JSON-SERIALIZE-FAIL: "A structured record could not be serialized as JSON."
  LIN-AUDIT-OUTPUT-PATH-INVALID: "A log output path is invalid or outside the plugin data directory."
  LIN-AUDIT-RUNTIME-CONFIG-LOAD-FAIL: "The runtime audit configuration could not be loaded; defaults are active."
  LIN-AUDIT-TENANT-CONFIG-LOAD-FAIL: "A plugin audit configuration could not be loaded; runtime settings are temporarily active."
  LIN-AUDIT-WRITER-FLUSH-FAIL: "The file writer queue did not finish flushing in time."
  LIN-AUDIT-WRITER-QUEUE-FULL: "The asynchronous file writer queue is full; this record was written synchronously."
  LIN-BANNER-FONT-LOAD-FAIL: "An ASCII banner font resource exists but could not be parsed."
  LIN-COMMAND-ARGUMENT-PARSE-FAIL: "A command argument resolver failed unexpectedly."
  LIN-COMMAND-BUKKIT-BIND-FAIL: "A command root could not be bound to a Bukkit PluginCommand."
  LIN-COMMAND-EXECUTE-FAIL: "The executor of a matched command threw an exception."
  LIN-COMMAND-GROUP-CALLBACK-FAIL: "A command group's common result callback failed."
  LIN-COMMAND-INFO-FAIL: "The command service could not read plugin information."
  LIN-COMMAND-LOCALE-REFRESH-FAIL: "Command usage and argument labels could not be refreshed for the new locale."
  LIN-COMMAND-MESSAGE-LOAD-FAIL: "Built-in command messages could not be loaded from the language service."
  LIN-DATA-FLUSH-FAIL: "Pending repository data could not be flushed."
  LIN-DATA-INITIALIZE-FAIL: "A database directory or connection pool could not be initialized."
  LIN-DATA-MIGRATE-FAIL: "An entity table could not be created or migrated."
  LIN-DATA-OPERATION-FAIL: "A database repository operation failed."
  LIN-DATA-RESOURCE-CLOSE-FAIL: "A database repository or connection pool could not be closed cleanly."
  LIN-EVENT-LISTENER-FAIL: "An event listener failed."
  LIN-FILE-CONFIG-BIND-FAIL: "A configuration class could not be bound for the first time."
  LIN-FILE-CONFIG-LOAD-FAIL: "Configuration loading or validation failed; the previous active values remain in use."
  LIN-FILE-CONFIG-RELOAD-FAIL: "A configuration file could not be reloaded into its existing object."
  LIN-FILE-CONFIG-SAVE-FAIL: "A configuration object could not be written to its file."
  LIN-FILE-DIFF-WRITE-FAIL: "A missing-key difference file could not be created."
  LIN-FILE-LANGUAGE-BIND-FAIL: "A language class could not be bound for the first time."
  LIN-FILE-LANGUAGE-ENSURE-FAIL: "Language-file validation or missing-key completion failed."
  LIN-FILE-LANGUAGE-LAZY-LOAD-FAIL: "A referenced language value could not lazily load its target locale."
  LIN-FILE-LANGUAGE-LISTENER-FAIL: "A language change listener failed."
  LIN-FILE-LANGUAGE-LOCALE-NORMALIZE-FAIL: "A language filename could not be normalized to a locale code."
  LIN-FILE-LANGUAGE-LOCALE-SCAN-FAIL: "Available locale files could not be scanned."
  LIN-FILE-LANGUAGE-LOCALE-SWITCH-FAIL: "A language object could not switch to the target locale."
  LIN-FILE-LANGUAGE-REFERENCE-FAIL: "A configuration language reference is missing or has an incompatible text type; its fallback is active."
  LIN-FILE-LANGUAGE-RELOAD-FAIL: "A language file could not be reloaded into its existing language object."
  LIN-FILE-LANGUAGE-RESOURCE-COPY-FAIL: "A bundled language resource could not be copied to the plugin data directory."
  LIN-FILE-LANGUAGE-RESOURCE-LOAD-FAIL: "A bundled language resource exists but could not be read or parsed."
  LIN-FILE-LANGUAGE-SAVE-FAIL: "A language object could not be written to its language file."
  LIN-FILE-OBJECT-MAPPING-FAIL: "A file document could not be mapped to or from a Java object."
  LIN-FILE-WATCH-CALLBACK-FAIL: "A file hot-reload callback failed."
  LIN-FILE-WATCH-LOOP-FAIL: "The file watch loop failed unexpectedly."
  LIN-FILE-WATCH-START-FAIL: "File hot-reload monitoring could not be started."
  LIN-MESSAGE-DELIVERY-FAIL: "The selected message transport could not deliver the message."
  LIN-MESSAGE-PREFIX-RESOLVE-FAIL: "The message prefix provider failed."
  LIN-PLATFORM-ASYNC-DISPATCH-FAIL: "A task could not be submitted to Bukkit's asynchronous scheduler; execution fell back to the current thread."
  LIN-PLATFORM-MAIN-DISPATCH-FAIL: "A task could not be submitted to Bukkit's main thread; execution fell back to the current thread."
  LIN-RUNTIME-CONFIG-RELOAD-FAIL: "The runtime configuration service failed to reload."
  LIN-RUNTIME-ENABLE-FAIL: "The Linlang runtime failed to start."
  LIN-RUNTIME-FACADE-CLOSE-FAIL: "A plugin facade could not be closed cleanly."
  LIN-RUNTIME-FACADE-RELOAD-FAIL: "A plugin facade failed to reload."
  LIN-RUNTIME-FACADE-RESTART-FAIL: "A plugin facade failed to restart."
  LIN-RUNTIME-LANGUAGE-RELOAD-FAIL: "The runtime language service failed to reload."
  LIN-RUNTIME-MESSAGE-TEMPLATE-INSTALL-FAIL: "Built-in runtime message templates could not be installed."
  LIN-RUNTIME-RELOAD-FAIL: "The reload encountered failures and some files were not reloaded."
  LIN-RUNTIME-RESOURCE-CLOSE-FAIL: "A runtime resource could not be released cleanly."
  LIN-RUNTIME-VERSION-INCOMPATIBLE: "The dependency and runtime A.B versions differ, or the runtime lacks the required API feature release; initialization was stopped."
  LIN-RUNTIME-VERSION-INVALID: "The dependency or runtime version is not a valid four-part version; initialization was stopped."
  LIN-RUNTIME-VERSION-MISMATCH: "The runtime API feature release is newer than the plugin's compile-time version; compatibility should be verified."
  LIN-TEXT-SOURCE-TOO-LONG: "The advanced-text source exceeds the runtime length limit."
  LIN-VIEW-DEFINITION-LOAD-FAIL: "A GUI definition file could not be read, parsed, or compiled."
  LIN-VIEW-HOOK-EXECUTE-FAIL: "A GUI interaction callback failed."
  LIN-VIEW-ICON-RESOLVE-FAIL: "A GUI icon could not be created by the platform resource resolver."
  LIN-VIEW-INITIALIZE-FAIL: "The view service or platform event bridge could not be initialized."
  LIN-VIEW-LANGUAGE-REFRESH-FAIL: "A view could not be redrawn after a locale change."
  LIN-VIEW-REOPEN-FAIL: "A GUI that cannot be closed manually could not be reopened."
  LIN-VIEW-SOURCE-LOAD-FAIL: "A dynamic GUI data source failed."
  LIN-YAML-INIT-FAIL: "SnakeYAML could not be loaded or initialized."

resolutions:
  LIN-AUDIT-FILE-WRITE-FAIL: "Check disk space, directory permissions, file locks, and the configured path."
  LIN-AUDIT-JSON-SERIALIZE-FAIL: "Check whether context fields contain objects that cannot be converted safely."
  LIN-AUDIT-OUTPUT-PATH-INVALID: "Use a relative path inside the plugin data directory; do not use an absolute path or .. segments."
  LIN-AUDIT-RUNTIME-CONFIG-LOAD-FAIL: "Check the structure, field types, and permissions of audit.yml."
  LIN-AUDIT-TENANT-CONFIG-LOAD-FAIL: "Check audit.yml in the plugin data directory and confirm that the plugin owner is registered."
  LIN-AUDIT-WRITER-FLUSH-FAIL: "Check disk health and verify that plugin shutdown is not blocking the writer."
  LIN-AUDIT-WRITER-QUEUE-FULL: "Check disk write performance and adjust queue-capacity for the server load."
  LIN-BANNER-FONT-LOAD-FAIL: "Check the height, gap, and glyphs structure of the font YAML."
  LIN-COMMAND-ARGUMENT-PARSE-FAIL: "Check the argument specification, resolver implementation, and received argument type."
  LIN-COMMAND-BUKKIT-BIND-FAIL: "Confirm that the command root is declared in plugin.yml and registered by the correct plugin."
  LIN-COMMAND-EXECUTE-FAIL: "Use the command and sender context to inspect the command's business logic."
  LIN-COMMAND-GROUP-CALLBACK-FAIL: "Use the command, stage, and handler context to inspect the group callback."
  LIN-COMMAND-INFO-FAIL: "Check the platform plugin descriptor and runtime version metadata."
  LIN-COMMAND-LOCALE-REFRESH-FAIL: "Check lazy language providers and the command description and argument-label implementations."
  LIN-COMMAND-MESSAGE-LOAD-FAIL: "Check the command language resources; the runtime will continue with file-independent defaults."
  LIN-DATA-FLUSH-FAIL: "Check the database connection, transaction state, and repository implementation."
  LIN-DATA-INITIALIZE-FAIL: "Check the JDBC configuration, driver, database directory permissions, and database availability."
  LIN-DATA-MIGRATE-FAIL: "Check database permissions, entity annotations, column definitions, and the existing table structure."
  LIN-DATA-OPERATION-FAIL: "Use the operation, entity, and table context to inspect SQL, connections, and field mappings."
  LIN-DATA-RESOURCE-CLOSE-FAIL: "Check for running database tasks and inspect repository and pool shutdown."
  LIN-EVENT-LISTENER-FAIL: "Use the event and owner context to locate the listener's business logic."
  LIN-FILE-CONFIG-BIND-FAIL: "Check configuration annotations, constructors, migrators, file format, and field types."
  LIN-FILE-CONFIG-LOAD-FAIL: "Review the Linlang diagnostic comments or the matching .errors.txt file, correct the errors, and reload."
  LIN-FILE-CONFIG-RELOAD-FAIL: "Check whether the configuration format, migrators, and field types match the code contract."
  LIN-FILE-CONFIG-SAVE-FAIL: "Check the target path, permissions, and whether configuration fields and values are serializable."
  LIN-FILE-DIFF-WRITE-FAIL: "Check target-directory permissions and whether the configuration or language document can be serialized."
  LIN-FILE-LANGUAGE-BIND-FAIL: "Check the LangPack annotation, no-argument constructor, resource files, and language field types."
  LIN-FILE-LANGUAGE-ENSURE-FAIL: "Check the language-pack annotation, locale code, resource files, and target-directory permissions."
  LIN-FILE-LANGUAGE-LAZY-LOAD-FAIL: "Check the target language file, path, and value type expected by LangText, LangList, or LangMap."
  LIN-FILE-LANGUAGE-LISTENER-FAIL: "Use the exception to inspect the service consuming language changes."
  LIN-FILE-LANGUAGE-LOCALE-NORMALIZE-FAIL: "Check file locks, directory permissions, and filename conflicts after normalization."
  LIN-FILE-LANGUAGE-LOCALE-SCAN-FAIL: "Check language-directory permissions, path validity, and filesystem state."
  LIN-FILE-LANGUAGE-LOCALE-SWITCH-FAIL: "Check the target language file and the types of bound language fields."
  LIN-FILE-LANGUAGE-REFERENCE-FAIL: "Check the language-pack alias, path within the pack, and the expected string or string-list type."
  LIN-FILE-LANGUAGE-RELOAD-FAIL: "Check the language-file format and the structure of LangText, LangList, and LangMap fields."
  LIN-FILE-LANGUAGE-RESOURCE-COPY-FAIL: "Check target-directory permissions, disk space, and whether the bundled resource can be read."
  LIN-FILE-LANGUAGE-RESOURCE-LOAD-FAIL: "Check the langservice resource content, character encoding, and packaged artifact."
  LIN-FILE-LANGUAGE-SAVE-FAIL: "Check the language-file path, permissions, and whether field values are serializable."
  LIN-FILE-OBJECT-MAPPING-FAIL: "Check field accessibility, no-argument constructors of nested objects, and collection field types."
  LIN-FILE-WATCH-CALLBACK-FAIL: "Inspect the reload logic for the affected file and review the path context."
  LIN-FILE-WATCH-LOOP-FAIL: "Check the WatchService state, watched directory, and callback thread."
  LIN-FILE-WATCH-START-FAIL: "Check whether the watched directory can be created and whether system file monitoring is available."
  LIN-MESSAGE-DELIVERY-FAIL: "Use the transport and recipient context to inspect the platform connection and transport implementation."
  LIN-MESSAGE-PREFIX-RESOLVE-FAIL: "Check the custom prefix provider and avoid accessing services before initialization."
  LIN-PLATFORM-ASYNC-DISPATCH-FAIL: "Check whether the plugin is disabled and whether the Bukkit scheduler still accepts tasks."
  LIN-PLATFORM-MAIN-DISPATCH-FAIL: "Check whether the plugin is disabled and whether the Bukkit scheduler still accepts tasks."
  LIN-RUNTIME-CONFIG-RELOAD-FAIL: "Check the configuration-file format, field types, and permissions."
  LIN-RUNTIME-ENABLE-FAIL: "Inspect the cause and verify API versions, service registration, and runtime compatibility."
  LIN-RUNTIME-FACADE-CLOSE-FAIL: "Inspect shutdown of services owned by the facade and check for blocking tasks."
  LIN-RUNTIME-FACADE-RELOAD-FAIL: "Use the owner context to locate the plugin and inspect prefix, locale, and refresh callbacks."
  LIN-RUNTIME-FACADE-RESTART-FAIL: "Use the owner context to locate the plugin and inspect reconstruction of file, command, message, and view services."
  LIN-RUNTIME-LANGUAGE-RELOAD-FAIL: "Check the language-file format, locale code, and file permissions."
  LIN-RUNTIME-MESSAGE-TEMPLATE-INSTALL-FAIL: "Check whether the runtime language resources and language service are initialized."
  LIN-RUNTIME-RELOAD-FAIL: "Review the failed files and stages, correct them, and run a soft reload again."
  LIN-RUNTIME-RESOURCE-CLOSE-FAIL: "Use the resource and owner context to locate the service that did not close."
  LIN-RUNTIME-VERSION-INCOMPATIBLE: "Install a Runtime that satisfies the plugin requirement; obtain a current build from https://jling.me/linlang"
  LIN-RUNTIME-VERSION-INVALID: "Check for an A.B.C.D version and obtain a complete build from https://jling.me/linlang"
  LIN-RUNTIME-VERSION-MISMATCH: "Prefer the same A.B.C version, or update the plugin API dependency and retest: https://jling.me/linlang"
  LIN-TEXT-SOURCE-TOO-LONG: "Shorten the text or split the message; do not parse large external content as advanced text."
  LIN-VIEW-DEFINITION-LOAD-FAIL: "Use the view context to inspect YAML or JSON definitions in the gui directory."
  LIN-VIEW-HOOK-EXECUTE-FAIL: "Use the view, hook, and slot context to inspect the callback."
  LIN-VIEW-ICON-RESOLVE-FAIL: "Use the resolver and icon context to check the material name or optional resource-plugin interface."
  LIN-VIEW-INITIALIZE-FAIL: "Check GUI event-listener registration, platform context, and the view directory."
  LIN-VIEW-LANGUAGE-REFRESH-FAIL: "Use the view context to inspect language references and platform view state."
  LIN-VIEW-REOPEN-FAIL: "Check player online state, plugin lifecycle, and Bukkit scheduler state."
  LIN-VIEW-SOURCE-LOAD-FAIL: "Use the view, area, and source context to inspect the data-source implementation."
  LIN-YAML-INIT-FAIL: "Check that SnakeYAML is present and compatible with the current Runtime."
