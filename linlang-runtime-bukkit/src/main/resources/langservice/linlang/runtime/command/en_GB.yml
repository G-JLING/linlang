prefix: "&f[&dLinlang&f] "

common:
  unknown: "unknown"
  enabled: "enabled"
  disabled: "disabled"

info:
  description: "Show Linlang runtime version and build info"
  title: " &7Runtime information:"
  api-version: "&7  API Version: &f{version}"
  runtime-version: "&7  Runtime Version: &f{version}"
  plugin-version: "&7  Plugin Version: &f{version}"

plugins:
  description: "List all plugins registered to this runtime"
  empty: " &7No plugin facades are currently registered."
  title: " &7Registered plugins ({count}):"
  entry: "&7  - &f{name} &8v{version} &7({status})"

restart:
  description: "Restart the Linlang instance of a plugin"
  plugin-label: "plugin name"
  empty-name: " &cPlugin name cannot be empty."
  ambiguous: " &cMultiple plugins matched. Enter a more specific name:"
  candidate: "&7  - &f{name}"
  not-found: " &cNo registered plugin named &f{name} &cwas found."
  success: " &aRestarted the Linlang instance of &f{name}&a."
  failed: " &cRestart failed. Problem code: &f{code}"

reload:
  description: "Soft-reload the runtime and all registered plugins"
  success: " &aSoft-reloaded the runtime and all registered plugins."
  partial: " &eReload completed with {count} failure(s). Check the problem codes."
  failed: " &cReload failed. Problem code: &f{code}"

restart-all:
  description: "Hard-restart all registered plugin facades"
  result: " &7Restarted plugin facades: &f{success} &7/ &f{total}&7."

problems:
  description: "List all built-in Linlang problem codes"
  title: " &7Built-in problem codes ({count}):"
  entry: "&f{code} &8[{component}] &7{description}"

problem:
  description: "Look up a Linlang problem code"
  code-label: "problem code"
  not-found: " &cProblem code not found: &f{code}"
  hint: "&7Use &f/linlang problems &7to list all built-in codes."
  title: " &f{code}"
  component: "&7Component: &f{value}"
  meaning: "&7Meaning: &f{value}"
  resolution: "&7Resolution: &f{value}"
  documentation: "&7Documentation: &f{value}"
