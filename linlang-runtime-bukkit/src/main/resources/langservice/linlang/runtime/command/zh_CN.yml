  failed: " &c重建失败，问题代码：&f{code}"

reload-plugin:
  description: "软重载指定插件的琳琅门面"
  success: " &a已软重载插件 &f{name} &a的琳琅门面。"
  failed: " &c重载失败，问题代码：&f{code}"

reload-all:
  description: "对运行时与所有插件执行软重载"
