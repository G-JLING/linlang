  failed: " &c缺失键修复失败，问题代码：&f{code}"

file-repair-all:
  description: "修复运行时和全部已注册插件托管文件中的缺失键"
  success: " &a已检查 &f{targets} &a个目标，共修复 &f{total} &a个缺失键。"
  partial: " &e已检查 {targets} 个目标并修复 {total} 个缺失键，但有 {failures} 个目标失败。"

problems:
  description: "列出全部琳琅内建问题代码"
  title: " &7内建问题代码（{count}）："
  entry: "&f{code} &8[{component}] &7{description}"

problem:
  description: "查询指定琳琅问题代码"
  code-label: "问题代码"
  not-found: " &c未找到问题代码：&f{code}"
