  failed: " &c重载失败，问题代码：&f{code}"

restart-all:
  description: "重建所有已注册插件的琳琅服务"
  result: " &7已尝试对所有插件执行重建：成功 &f{success} &7/ &f{total}&7。"

file-repair:
